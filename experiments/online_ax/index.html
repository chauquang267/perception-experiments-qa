<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perception de deux sons</title>
  <link rel="icon" href="data:," />

  <script src="../../vendor/jspsych/jspsych.js"></script>
  <link rel="stylesheet" href="../../vendor/jspsych/jspsych.css" />
  <script src="../../vendor/jspsych/plugin-preload.js"></script>
  <script src="../../vendor/jspsych/plugin-browser-check.js"></script>
  <script src="../../vendor/jspsych/plugin-html-button-response.js"></script>
  <script src="../../vendor/jspsych/plugin-html-keyboard-response.js"></script>
  <script src="../../vendor/jspsych/plugin-audio-keyboard-response.js"></script>
  <script src="../../vendor/jspsych/plugin-call-function.js"></script>

  <link rel="stylesheet" href="../../assets/css/shared.css" />
  <link rel="stylesheet" href="../../assets/css/perception.css" />
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./progress.css" />
  <link rel="stylesheet" href="./participant-refinement.css" />
</head>
<body>
  <script>
    (function () {
      var requestedSaveContext =
        new URLSearchParams(window.location.search).get("config") || "test";
      if (requestedSaveContext !== "pages") {
        document.write(
          '<script src="../../assets/js/save-utils-local.js"><\/script>'
        );
      }
    })();
  </script>
  
  <script src="../../assets/js/save-utils-online.js"></script>
  <script src="../../assets/js/save-router.js"></script>
  <script src="../../assets/js/participant-utils.js"></script>
  <script src="../../assets/js/runtime-data-utils.js"></script>
  <script src="../../assets/js/supervisor-preview.js"></script>
  <script src="../../assets/js/perception-runtime-utils.js"></script>

  <script>
    /*
     * ?config=test -> technical browser runtime with placeholder audio.
     * ?config=test&full=1&supervisor_preview=1 -> full technical supervisor preview.
     * ?config=scientific -> local scientific-stimulus browser rehearsal.
     * ?config=llf -> LLF hosted participant-ready runtime with scientific stimuli.
     * Valid pilot/main participant codes execute the complete scientific order automatically.
     * Reserved 00999NNN codes remain available for technical QA.
     * ?full=1 affects reserved technical QA only; participant runs are always complete.
     */
    (function () {
      var params = new URLSearchParams(window.location.search);
      var requested = params.get("config") || "test";
      var requestedLanguage = (params.get("lang") || "fr").toLowerCase();

      if (requested !== "pages") {
        window.PERCEPTION_CONFIG_ERROR =
          "AX config must be config=test, config=scientific, or config=llf.";
      }
      if (requestedLanguage !== "fr" && requestedLanguage !== "vi") {
        window.PERCEPTION_CONFIG_ERROR =
          "AX instruction language must be lang=fr or lang=vi.";
        requestedLanguage = "fr";
      }

      window.ONLINE_AX_REQUESTED_LANGUAGE = requestedLanguage;
      document.documentElement.lang = requestedLanguage;
      document.write('<script src="./config_test.js"><\/script>');
      if (requestedLanguage === "vi") {
        document.write('<script src="./config_test_vi.js"><\/script>');
      }
      if (requested === "scientific" || requested === "pages") {
        document.write('<script src="./config_scientific.js"><\/script>');
      }
      if (requested === "pages") {
        document.write('<script src="./config_pages.js"><\/script>');
      }
      if (window.ProsodySupervisorPreview.requested()) {
        document.write(
          '<script>window.ONLINE_AX_CONFIG = window.ProsodySupervisorPreview.applyPerception(window.ONLINE_AX_CONFIG, { documentTitle: "Perception de deux sons" });<\/script>'
        );
      }
    })();
  </script>
  <script src="./response-key-navigation.js"></script>
  <script src="./final-save-provenance.js"></script>
  <script src="./experiment.js"></script>
</body>
</html>
